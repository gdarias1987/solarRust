[package]
name = "solar-rust"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "38e75af6c22915c01d5e219f53d5f0af6edf9a11" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "38e75af6c22915c01d5e219f53d5f0af6edf9a11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
httpdate = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell"] }

# Build only on Windows: compiles `assets/app.rc` so the executable carries the Sun as its icon
# resource. Explorer, Start and pinning read the resource; the running window gets its icon from
# `rune::set_app_icon`.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

# NSWorkspace is the only supported way to change the desktop picture on modern macOS; the
# AppleScript route needs Automation grants and breaks across releases. Every AppKit submodule
# is its own feature, and the defaults pull in frameworks this app never touches, so the list
# is exactly what the wallpaper backend reads.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSURL", "NSString", "NSArray", "NSDictionary", "NSValue", "NSEnumerator"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSScreen", "NSCell"] }

# Match upstream's memory-conscious development profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
